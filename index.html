<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --font-exo: "Exo 2", sans-serif;
        }
    </style>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Exo 2", sans-serif;
        }

        .fondo-portafolio {
            background: linear-gradient(110deg, #6415dc 0%, #4148ed 52%, #2479f5 100%);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-[#303030] text-white font-exo">

    <div class="bg-[#303030] shadow-md shadow-black/20">
        <header class="max-w-[1400px] mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <a href="#inicio" class="text-xl sm:text-2xl font-semibold text-white no-underline">Mi Portafolio</a>

            <nav aria-label="Menú principal">
                <ul class="flex flex-wrap justify-center items-center gap-1 sm:gap-2 text-sm sm:text-base font-medium">
                    <li> <a href="#inicio" class="inline-block rounded-md bg-blue-600 px-3 py-2 text-white"> Introduccion</a></li>
                    <li> <a href="#" data-boton class="inline-block rounded-md px-3 py-2 text-white transition-colors hover:bg-white/10"> Proyectos</a></li>
                    <li> <a href="#" data-boton class="inline-block rounded-md px-3 py-2 text-white transition-colors hover:bg-white/10"> Noticias</a></li>
                    <li> <a href="#" data-boton class="inline-block rounded-md px-3 py-2 text-white transition-colors hover:bg-white/10"> Contacto</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <main id="inicio" class="fondo-portafolio flex flex-grow items-center justify-center px-5 py-14 sm:py-20 text-center">
        <section class="w-full max-w-[1000px] flex flex-col items-center">
            <div class="h-32 w-32 sm:h-40 sm:w-40 rounded-full border-4 border-white overflow-hidden shadow-lg">
                <img src="src/kibi.jpg" alt="Kibi" class="w-full h-full object-cover">
            </div>

            <h1 class="mt-5 text-4xl sm:text-5xl font-bold"> Nicolás </h1>

            <p class="mt-3 text-lg sm:text-2xl font-normal">Estudiante de informatica Duoc UC </p>

            <a
                href="https://github.com/kibo64"
                target="_blank"
                rel="noopener noreferrer"
                class="mt-5 text-base sm:text-lg text-white hover:underline break-all"
            >
                https://github.com/kibo64
            </a>
        </section>
    </main>

    <script>
        document.querySelectorAll("[data-boton]").forEach(function (boton) {
            boton.addEventListener("click", function (evento) {
                evento.preventDefault();
            });
        });
    </script>

</body>
</html>
